// Limits apply to both native and offline decoding after the snapshot is loaded.
var SHARE_MAX_TOKEN_LENGTH=2000000,SHARE_MAX_DECODED_BYTES=33554432;
function shareDataError(){return new Error("分享数据损坏或格式无效，请向分享者索取新链接")}
function shareDataTooLarge(){return new Error("分享数据过大，请让分享者分批分享")}
function readShareToken(){
  var fragment=String(location.hash||"").replace(/^#/,"");
  var oldQuery=new URLSearchParams(location.search).get("v");
  if(oldQuery)return oldQuery;
  return fragment.charAt(0)==="c"&&fragment.indexOf("=")===-1?fragment:new URLSearchParams(fragment).get("d")||"";
}
function shareBase64Bytes(encoded){
  if(!encoded||encoded.length>SHARE_MAX_TOKEN_LENGTH)throw encoded.length>SHARE_MAX_TOKEN_LENGTH?shareDataTooLarge():shareDataError();
  if(!/^[A-Za-z0-9+/_-]+={0,2}$/.test(encoded)||encoded.replace(/=+$/,"").length%4===1||(encoded.indexOf("=")!==-1&&encoded.length%4!==0))throw shareDataError();
  encoded=encoded.replace(/-/g,"+").replace(/_/g,"/");while(encoded.length%4)encoded+="=";
  var binary;try{binary=atob(encoded)}catch(x){throw shareDataError()}
  var bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;
}
function shareUint32(bytes,at){return (bytes[at]|bytes[at+1]<<8|bytes[at+2]<<16|bytes[at+3]<<24)>>>0}
var shareCrcTable=null;
function shareCrc32(bytes){
  if(!shareCrcTable){shareCrcTable=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;shareCrcTable[n]=c>>>0}}
  var crc=0xffffffff;for(var i=0;i<bytes.length;i++)crc=shareCrcTable[(crc^bytes[i])&255]^(crc>>>8);return (crc^0xffffffff)>>>0;
}
function checkShareGzip(bytes){
  if(bytes.length<18||bytes[0]!==31||bytes[1]!==139||bytes[2]!==8||(bytes[3]&224))throw shareDataError();
  var flags=bytes[3],at=10,end=bytes.length-8;
  if(flags&4){if(at+2>end)throw shareDataError();var size=bytes[at]|bytes[at+1]<<8;at+=2+size}
  if(at>end)throw shareDataError();
  if(flags&8){while(at<end&&bytes[at])at++;if(at>=end)throw shareDataError();at++}
  if(flags&16){while(at<end&&bytes[at])at++;if(at>=end)throw shareDataError();at++}
  if(flags&2){if(at+2>end||(shareCrc32(bytes.subarray(0,at))&65535)!==(bytes[at]|bytes[at+1]<<8))throw shareDataError();at+=2}
  if(at>=end)throw shareDataError();
  var length=shareUint32(bytes,bytes.length-4);if(length>SHARE_MAX_DECODED_BYTES)throw shareDataTooLarge();
  return {length:length,crc:shareUint32(bytes,bytes.length-8)};
}
function joinShareChunks(chunks,length){var bytes=new Uint8Array(length),at=0;for(var i=0;i<chunks.length;i++){bytes.set(chunks[i],at);at+=chunks[i].length}return bytes}
async function nativeShareGunzip(bytes){
  if(typeof window.DecompressionStream!=="function"||typeof Blob!=="function")throw shareDataError();
  var stream=new Blob([bytes]).stream().pipeThrough(new window.DecompressionStream("gzip")),reader=stream.getReader(),chunks=[],length=0;
  try{while(true){var part=await reader.read();if(part.done)break;length+=part.value.length;if(length>SHARE_MAX_DECODED_BYTES)throw shareDataTooLarge();chunks.push(part.value)}}catch(x){try{await reader.cancel()}catch(ignored){}throw x}finally{reader.releaseLock()}
  return joinShareChunks(chunks,length);
}
function offlineShareGunzip(bytes){
  if(typeof fflate!=="object"||typeof fflate.Gunzip!=="function")throw shareDataError();
  var chunks=[],length=0,stream=new fflate.Gunzip(function(chunk){length+=chunk.length;if(length>SHARE_MAX_DECODED_BYTES)throw shareDataTooLarge();chunks.push(chunk)});

  // chunks also bound temporary expansion before the output limit can be checked.
  stream.onmember=function(){throw shareDataError()};
  for(var at=0;at<bytes.length;at+=1024)stream.push(bytes.subarray(at,at+1024),at+1024>=bytes.length);
  return joinShareChunks(chunks,length);
}
async function shareGunzip(bytes){
  var expected=checkShareGzip(bytes),result;
  try{result=await nativeShareGunzip(bytes)}catch(nativeError){result=offlineShareGunzip(bytes)}
  if(result.length!==expected.length||shareCrc32(result)!==expected.crc)throw shareDataError();return result;
}
function shareUtf8(bytes){
  if(typeof TextDecoder==="function")return new TextDecoder("utf-8",{fatal:true}).decode(bytes);
  // Strict UTF-8 decoding for older WebViews without TextDecoder.
  var result=[],part="";for(var i=0;i<bytes.length;){var first=bytes[i++],point=first,count=0,min=0;
    if(first>=194&&first<=223){point=first&31;count=1;min=128}else if(first>=224&&first<=239){point=first&15;count=2;min=2048}else if(first>=240&&first<=244){point=first&7;count=3;min=65536}else if(first>127)throw shareDataError();
    if(i+count>bytes.length)throw shareDataError();for(var k=0;k<count;k++){var next=bytes[i++];if((next&192)!==128)throw shareDataError();point=point*64+(next&63)}

    if(point>65535){point-=65536;part+=String.fromCharCode(55296+(point>>10),56320+(point&1023))}else part+=String.fromCharCode(point);

async function decodeSharePayload(raw){
  if(!raw)throw new Error("分享链接缺少产品数据");if(raw.length>SHARE_MAX_TOKEN_LENGTH)throw shareDataTooLarge();
  if(raw.charAt(0)==="c")return BuyerShareCodec.decode(raw);
  var mode=raw.charAt(0);if(mode!=="j"&&mode!=="z")throw new Error("分享链接的数据版本不受支持");
  try{var bytes=shareBase64Bytes(raw.slice(1));if(mode==="z")bytes=await shareGunzip(bytes);if(bytes.length>SHARE_MAX_DECODED_BYTES)throw shareDataTooLarge();var data=JSON.parse(shareUtf8(bytes));
    if(!data||typeof data!=="object"||Array.isArray(data)||(data.v!=null&&data.v!==1)||!Array.isArray(data.products))throw shareDataError();
    if(!data.products.length)throw new Error("分享链接中没有产品");
    for(var i=0;i<data.products.length;i++)if(!data.products[i]||typeof data.products[i]!=="object"||Array.isArray(data.products[i]))throw shareDataError();
    return data;
  }catch(x){if(x&&/^(分享数据过大|分享链接中没有产品)/.test(x.message))throw x;throw shareDataError()}
}
async function load(){
  var raw=readShareToken();
  if(!raw){
    var key=new URLSearchParams(String(location.hash||"").replace(/^#/,"")).get("s");
    if(key!==null)raw=await BuyerGithubShare.open(key);
  }
  var data=await decodeSharePayload(raw),products=data.products;
  document.title="寻品产品分享 · "+products.length+" 个产品";
  document.getElementById("summary").textContent=products.length+" 个产品 · 分享时内容快照 · 可截图或打印";
  document.getElementById("cards").innerHTML=products.map(card).join("");
  return products.length;
}
load().catch(function(err){document.getElementById("summary").textContent="无法显示分享内容";document.getElementById("cards").innerHTML="<div class=\"emptyState\">"+e(err&&err.message?err.message:"分享链接无效")+"</div>"})
</script></body></html>
