<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻品产品分享</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f2f6f3;color:#203a2e;font:16px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}.page{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.head h1{font-size:24px;margin:0}.head p{margin:2px 0;color:#607269;font-size:12px}.head button{border:1px solid #cbded2;border-radius:8px;background:#fff;padding:8px 12px;color:#285844;font-weight:650}.product{position:relative;background:#fff;border:1px solid #dce7df;border-radius:16px;padding:20px;margin:0 0 16px;break-inside:avoid;box-shadow:0 3px 12px #1835220c}.product-head{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #e7eee9;padding-bottom:7px;margin-bottom:8px;color:#607269}.product-head b{color:#1b3337;white-space:nowrap}.images{display:grid;grid-template-columns:1fr 1fr;gap:9px}.images figure{position:relative;margin:0;min-width:0}.images img,.empty{width:100%;height:clamp(180px,32vh,300px);object-fit:contain;background:#f6f8f6;border-radius:9px}.empty{display:grid;place-items:center;color:#89978e}.images figcaption{font-size:11px;font-weight:700;color:#587064;margin:4px 2px}.share-badges{position:absolute;right:7px;top:7px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:calc(100% - 14px);pointer-events:none}.share-badge{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 7px;border:1px solid #ffffffb8;border-radius:999px;background:#fffef0ef;color:#6b4b14;box-shadow:0 2px 8px #18241124;font-size:10px;line-height:1.25;font-weight:750;white-space:nowrap}.share-badge i{font-style:normal;font-size:12px}.share-badge.crown{background:#fff7dd;color:#80550a}.field{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;padding:6px 2px;border-bottom:1px solid #edf1ee;overflow-wrap:anywhere}.field b{color:#718078;font-weight:600}.field a{color:#167653;overflow-wrap:anywhere;word-break:break-all}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.emptyState{padding:35px;text-align:center;color:#687a71}.footer{margin:8px 0;color:#77867d;font-size:10px;text-align:center}@media(max-width:560px){body{padding:8px}.product{padding:10px}.images img,.empty{height:130px}.field{grid-template-columns:94px 1fr}.head h1{font-size:18px}}@media print{body{background:#fff;padding:0}.product{box-shadow:none;margin-bottom:8px}.head button{display:none}}</style><style>.images.single-image{grid-template-columns:minmax(0,1fr)}.images.single-image figure{max-width:100%}.images img,.empty{height:clamp(210px,40vh,420px)}.image-caption-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}.image-caption-row figcaption{margin:0}.share-badges-inline{position:static;display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;max-width:78%;pointer-events:none}.share-badges-inline .share-badge{font-size:9px;line-height:1.15;padding:2px 6px;box-shadow:none}@media(max-width:560px){.images img,.empty{height:180px}.image-caption-row{gap:5px}.share-badges-inline{max-width:68%}}</style></head>
<body><main class="page"><header class="head"><div><h1>寻品产品信息</h1><p id="summary">正在读取分享内容…</p></div><button type="button" onclick="window.print()">打印 / 保存 PDF</button></header><div id="cards"></div><div class="footer">产品信息来自买手工作看板</div></main>
<script>
function e(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;"})}
function safeUrl(v){try{var u=new URL(String(v||""));return /^https?:$/.test(u.protocol)?u.href:""}catch(x){return ""}}
function imageUrl(v){var s=String(v||"");return /^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(s)?s:safeUrl(s)}
function img(src,label){var u=imageUrl(src);return u?("<img src=\""+e(u)+"\" alt=\""+e(label)+"\">"):"<div class=\"empty\">暂无图片</div>"}
function field(name,value){return "<div class=\"field\"><b>"+e(name)+"</b><span>"+e(value||"—")+"</span></div>"}
function chineseField(name,value,missing){var text=String(value==null?"":value).trim();if(!text||/^(?:[—–-]+|待翻译|翻译中|未提供|待补全)$/.test(text))text=missing;return field(name,text)}
function badges(items){return "<div class=\"share-badges-inline\">"+(items||[]).map(function(x){return "<span class=\"share-badge "+e(x.kind)+"\"><i>"+e(x.icon)+"</i>"+e(x.text)+"</span>"}).join("")+"</div>"}
function card(p,i){var shopee=safeUrl(p.shopeeUrl);var link=p.shopee?(shopee?"<a href=\""+e(shopee)+"\" target=\"_blank\" rel=\"noopener\">"+e(p.shopee)+"</a>":e(p.shopee)):"—";return "<article class=\"product\"><div class=\"product-head\"><span>产品 "+(i+1)+"</span><b>Model ID "+e(p.id)+"</b></div><div class=\"images single-image\"><figure>"+img(p.model,"型号图片")+"<div class=\"image-caption-row\"><figcaption>型号图片</figcaption>"+badges(p.badges)+"</div></figure></div>"+chineseField("中文标题",p.itemChinese,"中文标题未提供，请联系分享者补全")+chineseField("中文型号",p.modelChinese,"中文型号未提供，请联系分享者补全")+"<div class=\"two\">"+field("目标价",p.target)+field("上新类目",p.category)+"</div>"+(p.invitation?field("邀请ID",p.invitation):"")+"<div class=\"field\"><b>Shopee link</b><span>"+link+"</span></div></article>"}
async function load(){var raw=new URLSearchParams(location.search).get("v")||(location.hash.indexOf("#d=")===0?location.hash.slice(3):"");if(!raw)throw new Error("分享链接缺少产品数据");var mode=raw.charAt(0),encoded=raw.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(encoded.length%4)encoded+="=";var bytes=Uint8Array.from(atob(encoded),function(c){return c.charCodeAt(0)});var data;if(mode==="z"){if(!("DecompressionStream" in window))throw new Error("当前浏览器不支持解压分享数据");data=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).json()}else data=JSON.parse(new TextDecoder().decode(bytes));var products=Array.isArray(data.products)?data.products:[];if(!products.length)throw new Error("分享链接中没有产品");document.title="寻品产品分享 · "+products.length+" 个产品";document.getElementById("summary").textContent=products.length+" 个产品 · 中文标题与类目 · 可截图或打印";document.getElementById("cards").innerHTML=products.map(card).join("")}
load().catch(function(err){document.getElementById("summary").textContent="无法显示分享内容";document.getElementById("cards").innerHTML="<div class=\"emptyState\">"+e(err&&err.message?err.message:"分享链接无效")+"</div>"})
</script></body></html>
